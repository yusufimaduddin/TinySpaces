<!DOCTYPE html>
<html lang="id" x-data="themeConfig">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ @title }} - TinySpaces</title>
    <link rel="icon" type="image/png" href="/public/images/favicon.png">
    <link href="/public/css/style.css" rel="stylesheet">
    <link href="/public/css/prose.css" rel="stylesheet">
    <link href="/node_modules/boxicons/css/boxicons.min.css" rel="stylesheet">
    <script src="/node_modules/alpinejs/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="/public/js/app.js"></script>
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 h-screen flex flex-col overflow-hidden"
    x-data="editorManager" data-space-id="{{ @space_id }}" data-file-id="{{ @file_id }}"
    data-file-name="{{ @file_name }}" data-file-extension="{{ @file_extension }}"
    data-is-markdown="{{ @is_markdown ? '1' : '0' }}" data-can-edit="{{ @can_edit ? '1' : '0' }}">

    <!-- HEADER -->
    <header
        class="border-b border-gray-200 bg-white/80 backdrop-blur-md dark:bg-gray-800/90 dark:border-gray-700 relative z-20 shrink-0">
        <div class="mx-auto flex w-full items-center justify-between gap-2 px-3 py-2 sm:px-4 sm:py-3">
            <div class="flex min-w-0 flex-1 items-center gap-2 sm:gap-4">
                <a href="/user/space/{{ @space_id }}"
                    class="flex shrink-0 items-center justify-center p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-gray-200 transition-colors">
                    <i class='bx bx-arrow-back text-xl'></i>
                </a>

                <div class="flex min-w-0 flex-1 flex-col">
                    <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
                        <i class='bx bx-folder shrink-0'></i>
                        <span class="truncate max-w-[40vw] sm:max-w-[200px]">{{ @space_name }}</span>
                    </div>
                    <h1
                        class="flex min-w-0 items-center gap-2 truncate text-sm font-semibold text-gray-900 dark:text-white sm:text-base">
                        <span class="truncate">{{ @file_name }}</span>
                        <span x-show="unsavedChanges" x-transition
                            class="h-2 w-2 shrink-0 rounded-full bg-yellow-500 inline-block"
                            title="Unsaved changes"></span>
                    </h1>
                </div>
            </div>

            <div class="flex shrink-0 items-center gap-1 sm:gap-2">
                <!-- Toggle Preview -->
                <button @click="togglePreview()" x-show="isMarkdown"
                    class="hidden sm:inline-flex items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-600 px-3 py-1.5 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
                    :class="showPreview ? 'bg-gray-100 dark:bg-gray-700' : ''">
                    <i class='bx' :class="showPreview ? 'bx-hide' : 'bx-show'"></i>
                    <span x-text="showPreview ? 'Hide Preview' : 'Show Preview'"></span>
                </button>

                <!-- Mobile Toggle -->
                <button @click="togglePreview()" x-show="isMarkdown" title="Toggle preview"
                    class="inline-flex sm:hidden p-2 rounded-lg border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300">
                    <i class='bx' :class="showPreview ? 'bx-hide' : 'bx-show'"></i>
                </button>

                <!-- Download -->
                <button @click="downloadFile()"
                    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 p-2 text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700 sm:px-3 sm:py-1.5"
                    title="Download File">
                    <i class='bx bx-download text-lg'></i>
                    <span class="hidden sm:inline">Download</span>
                </button>

                <!-- Save -->
                <template x-if="canEdit">
                    <button @click="saveFile()" title="Save file"
                        class="inline-flex items-center gap-2 rounded-lg bg-black px-3 py-2 text-sm text-white transition-colors hover:bg-gray-800 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-blue-600 dark:hover:bg-blue-700 sm:px-4"
                        :disabled="saving">
                        <i class='bx' :class="saving ? 'bx-loader-alt bx-spin' : 'bx-save'"></i>
                        <span x-text="saving ? 'Saving...' : 'Save'"></span>
                    </button>
                </template>
                <template x-if="!canEdit">
                    <span
                        class="whitespace-nowrap rounded-full border border-gray-200 bg-gray-100 px-2.5 py-1.5 text-xs text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 sm:px-3">
                        Read Only
                    </span>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN EDITOR AREA -->
    <main class="flex-1 flex overflow-hidden relative">
        <!-- Editor Pane (Textarea) -->
        <div class="h-full flex-1 relative bg-white dark:bg-gray-900 transition-all duration-300"
            :class="isMarkdown && showPreview ? 'w-1/2 hidden sm:block border-r border-gray-200 dark:border-gray-700' : 'w-full'">
            <textarea x-model="content" @input="handleInput" @keydown.tab="handleTab($event)"
                x-ref="editor" @scroll="onScroll('editor')"
                class="w-full h-full resize-none p-4 md:p-6 text-sm md:text-base font-mono bg-transparent border-0 focus:ring-0 outline-none text-gray-800 dark:text-gray-200 leading-relaxed"
                :placeholder="isMarkdown ? 'Start writing markdown...' : 'Edit ' + (fileExtension || 'text') + ' content...'"
                spellcheck="false"></textarea>
        </div>

        <!-- Preview Pane -->
        <div x-show="isMarkdown" class="h-full bg-white dark:bg-gray-800 overflow-y-auto transition-all duration-300"
            :class="showPreview ? 'w-full sm:w-1/2 block' : 'w-0 hidden'" x-ref="preview"
            @scroll="onScroll('preview')">
            <div class="p-8 max-w-none mx-auto h-full">
                <div class="md-display" x-html="parsedContent"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER / STATUS BAR -->
    <footer
        class="border-t border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-700 px-4 py-2 text-xs text-gray-600 dark:text-gray-400 flex items-center justify-between gap-3 z-20 shrink-0">
        <span class="truncate" x-text="languageLabel"></span>
        <label x-show="isMarkdown"
            class="flex shrink-0 items-center gap-2 cursor-pointer select-none hover:text-gray-900 dark:hover:text-gray-200 transition-colors">
            <input type="checkbox" x-model="syncScroll"
                class="rounded border-gray-300 text-black focus:ring-black dark:border-gray-600 dark:bg-gray-700 dark:focus:ring-blue-600">
            <span>Sync Scroll</span>
        </label>
    </footer>

    <!-- TOAST COMPONENT -->
    <div x-data>
        <div x-show="$store.toast.visible" style="display: none;" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2"
            class="fixed top-20 right-6 flex items-center gap-2 rounded-xl border border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-700 z-50 px-4 py-3 text-sm shadow-lg">
            <i :class="{
                'bx-check-circle text-green-600 dark:text-green-400': $store.toast.type === 'success',
                'bx-x-circle text-red-600 dark:text-red-400': $store.toast.type === 'error',
                'bx-info-circle text-blue-600 dark:text-blue-400': $store.toast.type === 'info'
            }" class="bx text-lg"></i>
            <span x-text="$store.toast.message" class="dark:text-gray-300"></span>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            // Theme Config (Shared)
            Alpine.data('themeConfig', () => ({
                isDark: localStorage.getItem('theme') === 'dark',
                toggleDarkMode() {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                    this.updateTheme();
                },
                updateTheme() {
                    if (this.isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                },
                init() {
                    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.isDark = true;
                    }
                    this.updateTheme();
                }
            }));

            // Editor Manager
            Alpine.data('editorManager', () => ({
                spaceId: '',
                fileId: '',
                fileName: '',
                fileExtension: '',
                isMarkdown: false,
                canEdit: false,

                content: '',
                parsedContent: '',
                unsavedChanges: false,
                saving: false,
                showPreview: false,
                syncScroll: true,
                isScrolling: false,

                get languageLabel() {
                    if (this.isMarkdown) return 'Markdown';
                    return this.fileExtension ? `${this.fileExtension} source` : 'Plain text';
                },

                init() {
                    const el = this.$el;
                    this.spaceId = el.dataset.spaceId || '';
                    this.fileId = el.dataset.fileId || '';
                    this.fileName = el.dataset.fileName || 'file';
                    this.fileExtension = (el.dataset.fileExtension || '').toUpperCase();
                    this.isMarkdown = el.dataset.isMarkdown === '1';
                    this.canEdit = el.dataset.canEdit === '1';

                    // Only Markdown gets a preview; code/text files use the
                    // full editor width without any Markdown preview pane.
                    this.showPreview = this.isMarkdown && window.innerWidth >= 640;

                    this.loadFile();

                    document.addEventListener('keydown', (e) => {
                        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                            e.preventDefault();
                            this.saveFile();
                        }
                    });

                    window.addEventListener('beforeunload', (e) => {
                        if (!this.unsavedChanges) return;
                        e.preventDefault();
                        e.returnValue = '';
                    });
                },

                handleInput() {
                    this.unsavedChanges = true;

                    if (this.isMarkdown) {
                        this.parsedContent = window.renderMarkdown(this.content);
                    }
                },

                async loadFile() {
                    try {
                        const response = await fetch(`/api/spaces/${this.spaceId}/files/${this.fileId}/view?raw=1`, {
                            headers: { 'X-Requested-With': 'XMLHttpRequest' },
                            credentials: 'same-origin'
                        });

                        if (response.status === 401 || response.url.includes('/login')) {
                            this.handleSessionExpired();
                            return;
                        }

                        if (!response.ok) throw new Error('Failed to load file');

                        const text = await response.text();
                        this.content = text;
                        this.parsedContent = this.isMarkdown ? window.renderMarkdown(text) : '';
                        this.unsavedChanges = false;
                    } catch (error) {
                        showAlpineToast(error.message || 'Error loading file', 'error');
                    }
                },

                handleSessionExpired() {
                    if (window.__sessionExpiredHandled) return;

                    window.__sessionExpiredHandled = true;
                    showAlpineToast('Sesi Anda telah berakhir. Silakan login kembali.', 'error');
                    setTimeout(() => { window.location.href = '/login'; }, 1200);
                },

                async saveFile() {
                    if (!this.canEdit || this.saving) return;

                    this.saving = true;
                    try {
                        const result = await apiFetch(`/api/spaces/${this.spaceId}/files/${this.fileId}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                content: this.content
                            })
                        });

                        if (result.success) {
                            showAlpineToast('File saved successfully!', 'success');
                            this.unsavedChanges = false;
                        } else {
                            showAlpineToast(result.message || 'Failed to save file', 'error');
                        }
                    } catch (error) {
                        if (error.name !== 'AuthError') {
                            showAlpineToast(error.message || 'Error saving file', 'error');
                        }
                    } finally {
                        this.saving = false;
                    }
                },

                async downloadFile() {
                    try {
                        const response = await fetch(`/api/spaces/${this.spaceId}/files/${this.fileId}/download`, {
                            headers: { 'X-Requested-With': 'XMLHttpRequest' },
                            credentials: 'same-origin'
                        });

                        if (response.status === 401 || response.url.includes('/login')) {
                            this.handleSessionExpired();
                            return;
                        }

                        if (!response.ok) {
                            showAlpineToast('Failed to download file', 'error');
                            return;
                        }

                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = this.fileName || 'download';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => window.URL.revokeObjectURL(url), 1000);
                    } catch (error) {
                        showAlpineToast('Error downloading file: ' + error.message, 'error');
                    }
                },

                togglePreview() {
                    if (!this.isMarkdown) return;
                    this.showPreview = !this.showPreview;
                },

                handleTab(event) {
                    // Keep normal keyboard navigation for Markdown and Shift+Tab.
                    if (event.shiftKey || this.isMarkdown) return;

                    event.preventDefault();
                    this.insertTab(event);
                },

                insertTab(event) {
                    const el = event.target;
                    const start = el.selectionStart;
                    const end = el.selectionEnd;
                    const indent = '    ';

                    this.content = this.content.slice(0, start) + indent + this.content.slice(end);
                    this.unsavedChanges = true;

                    this.$nextTick(() => {
                        el.selectionStart = el.selectionEnd = start + indent.length;
                    });
                },

                onScroll(source) {
                    if (!this.syncScroll || !this.isMarkdown || !this.showPreview) return;
                    if (this.isScrolling) return;

                    const editor = this.$refs.editor;
                    const preview = this.$refs.preview;

                    if (!editor || !preview) return;

                    this.isScrolling = true;

                    if (source === 'editor') {
                        const max = editor.scrollHeight - editor.clientHeight;
                        if (max > 0) {
                            preview.scrollTop = (editor.scrollTop / max) *
                                (preview.scrollHeight - preview.clientHeight);
                        }
                    } else {
                        const max = preview.scrollHeight - preview.clientHeight;
                        if (max > 0) {
                            editor.scrollTop = (preview.scrollTop / max) *
                                (editor.scrollHeight - editor.clientHeight);
                        }
                    }

                    setTimeout(() => {
                        this.isScrolling = false;
                    }, 10);
                }
            }));
        });
    </script>
</body>

</html>
